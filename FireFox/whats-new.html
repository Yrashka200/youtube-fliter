<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="dark" />
  <title>What's New - YouTube Feed Filter</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #f5f5f5;
      background: #101113;
      font-synthesis: none;
    }

    * { box-sizing: border-box; }

    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      padding: 48px 20px;
      background:
        radial-gradient(ellipse at 50% -20%, rgba(255, 40, 40, .18), transparent 55%),
        #101113;
    }

    .shell { max-width: 820px; margin: 0 auto; }
    .brand { margin-bottom: 22px; color: #b7b8bf; font-size: 14px; font-weight: 700; }
    .card {
      overflow: hidden;
      border: 1px solid #2b2c31;
      border-radius: 20px;
      background: rgba(25, 26, 30, .96);
      box-shadow: 0 24px 80px rgba(0, 0, 0, .35);
    }
    header { padding: 32px 38px 22px; }
    .eyebrow {
      color: #ff7777;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .13em;
      text-transform: uppercase;
    }
    h1 { margin: 10px 0 8px; font-size: clamp(26px, 5vw, 36px); letter-spacing: -.035em; }
    .lead { margin: 0; color: #b7b8bf; font-size: 15px; line-height: 1.65; }
    main { padding: 8px 38px 34px; }
    .entry { padding: 22px 0; border-top: 1px solid #2d2e33; }
    .entry:first-child { border-top: 0; }
    .entry-head { display: flex; align-items: baseline; gap: 10px; }
    .version { color: #fff; font-size: 18px; font-weight: 750; }
    .date { color: #92949b; font-size: 12px; }
    .entry-body { margin-top: 12px; color: #c9c9ce; font-size: 14px; line-height: 1.7; }
    .entry-body h2 { margin: 18px 0 6px; color: #f5f5f5; font-size: 15px; }
    .entry-body ul { margin: 6px 0 12px; padding-left: 22px; }
    .entry-body li { margin-bottom: 4px; }
    .entry-body code { padding: 2px 5px; border-radius: 4px; background: #303137; }
    .status { padding: 20px 0; color: #b7b8bf; font-size: 14px; }
    .status.error { color: #ff8e8e; }
    footer { padding: 18px 38px; border-top: 1px solid #2d2e33; color: #92939a; font-size: 12px; }
    footer a { color: #c1c1c6; }

    @media (max-width: 620px) {
      body { padding: 22px 12px; }
      header { padding: 25px 20px 19px; }
      main { padding: 4px 20px 25px; }
      footer { padding: 15px 20px; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <div class="brand">YouTube Feed Filter</div>
    <section class="card" aria-labelledby="pageTitle">
      <header>
        <div class="eyebrow">Thanks for updating</div>
        <h1 id="pageTitle">What's new</h1>
        <p class="lead">Thank you for using YouTube Feed Filter. Here's what's changed recently.</p>
      </header>
      <main id="changelog" aria-live="polite">
        <div class="status">Loading release notes…</div>
      </main>
      <footer>Open source on <a href="https://github.com/Yrashka200/youtube-fliter" target="_blank" rel="noopener">GitHub</a>.</footer>
    </section>
  </div>
  <script src="whats-new.js"></script>
</body>
</html>
